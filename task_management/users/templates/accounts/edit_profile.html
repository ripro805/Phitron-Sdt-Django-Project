{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gradient-to-br from-blue-100 via-white to-blue-200">
  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-10">
    <div class="flex flex-col items-center mb-8">
      <h2 class="text-3xl font-extrabold text-blue-700 mb-2">Edit Profile</h2>
      <p class="text-gray-500">Update your information and profile picture</p>
      {% if profile.profile_picture %}
        <div class="mt-6">
          <img src="{{ profile.profile_picture.url }}" alt="Profile Picture" class="w-32 h-32 rounded-full object-cover border-4 border-blue-300 shadow-md">
        </div>
      {% else %}
        <div class="mt-6">
          <img src="{% static 'images/banner/default-profile.png' %}" alt="Default Profile" class="w-32 h-32 rounded-full object-cover border-4 border-blue-200 shadow-md">
        </div>
      {% endif %}
    </div>
    <form method="post" enctype="multipart/form-data" class="space-y-6">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
